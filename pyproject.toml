[project]
name = "docpilot"
version = "0.1.0"
description = "Self-hosted multi-tenant document intelligence and RAG platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "pwdlib[argon2]>=0.3.1",
    "pydantic[email]>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.1.1",
    "uvicorn[standard]>=0.54.0",
    "pymupdf>=1.28.2",
    "python-docx>=1.2.0",
    "openpyxl>=3.1.5",
    "flagembedding>=1.4.2",
    "pgvector>=0.5.0",
    "numpy==2.2.6",
    "scipy==1.15.3",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "reportlab>=5.0.1",
]

[tool.pytest.ini_options]
pythonpath = ["backend"]
asyncio_mode = "auto"
