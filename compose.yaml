services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: docpilot
      POSTGRES_USER: docpilot
      POSTGRES_PASSWORD: docpilot_dev
    ports:
      - "5433:5432"
    volumes:
      - docpilot_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docpilot -d docpilot"]
      interval: 5s
      timeout: 5s
      retries: 5


  llama-server:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    restart: unless-stopped
    ports:
      - "3000:8080"
    volumes:
      - ./data/models/llama.cpp:/root/.cache
    command:
      - "-hf"
      - "ggml-org/Qwen3-1.7B-GGUF:Q4_K_M"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "--alias"
      - "docpilot-qwen3-1.7b"
      - "-c"
      - "4096"
      - "-ngl"
      - "99"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  docpilot_postgres_data: